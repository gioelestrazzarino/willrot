  openSheet(`<h3>${esc(h.name)}</h3><p class="muted" style="margin:-10px 0 12px">${esc(label)} · target ${fmtNum(h.target_value)} ${esc(h.unit || '')}</p><form>
    <div class="stepper"><button type="button" data-step="-1">−</button><input name="value" type="number" step="any" min="0" inputmode="decimal" value="${v || ''}" placeholder="0"><button type="button" data-step="1">+</button></div>
    <div class="btns" style="margin-top:0"><button type="button" class="btn ghost" data-fill="${+h.target_value}">Hit target</button><button type="button" class="btn ghost" data-fill="0">Clear</button></div>
    <button class="btn" type="submit" style="margin-top:12px">Save</button></form>`, f => {
    const val = Math.max(0, +f.value.value || 0);
    setLog(h, n, { completed: val >= (+h.target_value || Infinity), value: val });
  });
}
function dayEditSheet(h, n) {
  if (h.type === 'quantity') return qtySheet(h, n);
  const done = doneOn(h, n);
  openSheet(`<h3>${esc(h.name)}</h3><p class="muted" style="margin:-10px 0 16px">${fmtDay(n, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' })}${!isWeekly(h) && !isDue(h, n) ? ' · not scheduled' : ''}</p>
    <form><button class="btn ${done ? 'ghost' : ''}" type="submit">${done ? 'Mark as not done' : 'Mark as done'}</button></form>`, () => {
    setLog(h, n, { completed: !done, value: null });
  });
}
function passwordSheet() {
  openSheet(`<h3>Set a new password</h3><form><label class="field"><span>New password</span><input type="password" name="pw" minlength="6" required autocomplete="new-password"></label><button class="btn" type="submit">Update password</button></form>`, async f => {
    if (f.pw.value.length < 6) { toast('At least 6 characters'); return false; }
    const { error } = await sb.auth.updateUser({ password: f.pw.value });
    if (error) { toast(error.message); return false; }
    toast('Password updated');
  });
}

/* ============================================================
   Push notifications
   ============================================================ */
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const remindHour = () => lsGet('willrot_remind_hour', 20);
function b64ToU8(b64) { const p = '='.repeat((4 - b64.length % 4) % 4); const s = atob((b64 + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(s, c => c.charCodeAt(0)); }

async function pushState() {
  if (!pushSupported()) return isIOS && !isStandalone() ? 'install' : 'unsupported';
  if (Notification.permission === 'denied') return 'denied';
  const reg = await navigator.serviceWorker.getRegistration();
  const sub = await reg?.pushManager.getSubscription();
  return sub && Notification.permission === 'granted' ? 'on' : 'off';
}
async function saveSubscription(sub) {
  const j = sub.toJSON();
  return db(sb.from('push_subscriptions').upsert({
    user_id: S.user.id, endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth,
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC', remind_hour: remindHour(), user_agent: navigator.userAgent.slice(0, 200),
  }, { onConflict: 'endpoint' }));
}
async function enablePush() {
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { toast('Notifications not allowed'); return render(); }
    const reg = await navigator.serviceWorker.ready;
    const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(VAPID_PUBLIC_KEY) });
    await saveSubscription(sub);
    toast('Reminders on');
  } catch (e) { console.error(e); toast('Could not enable reminders: ' + (e.message || e)); }
  render();
}
async function disablePush() {
  const reg = await navigator.serviceWorker.getRegistration();
  const sub = await reg?.pushManager.getSubscription();
  if (sub) { await sb.from('push_subscriptions').delete().eq('endpoint', sub.endpoint); await sub.unsubscribe(); }
  toast('Reminders off'); render();
}
async function syncPushSubscription() {
  try {
    if (!pushSupported() || Notification.permission !== 'granted') return;
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub) await saveSubscription(sub);
  } catch (e) { console.warn('push sync', e); }
}
async function testPush() {
  const { data: { session } } = await sb.auth.getSession();
  try {
    const res = await fetch(PUSH_FN_URL, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session?.access_token, apikey: SUPABASE_ANON }, body: JSON.stringify({ test: true }) });
    const j = await res.json().catch(() => ({}));
    toast(res.ok ? 'Test sent — check your notifications' : 'Test failed: ' + (j.error || res.status));
  } catch (e) { toast('Edge Function unreachable (deployed yet?)'); }
}
async function fillPushCard() {
  const el = $('#push-card'); if (!el) return;
  const st = await pushState(); if (!$('#push-card')) return;
  const hourSel = `<select data-act-change="remind-hour" style="width:auto">${Array.from({ length: 24 }, (_, i) => `<option value="${i}" ${i === remindHour() ? 'selected' : ''}>${pad(i)}:00</option>`).join('')}</select>`;
  el.innerHTML = {
    on: `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><b>Reminders on</b><div class="muted small">Daily nudge for anything still due</div></div>${hourSel}</div><div class="btns"><button class="btn ghost" data-act="push-test">Send test</button><button class="btn ghost" data-act="push-off">Turn off</button></div>`,
    off: `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><b>Daily reminder</b><div class="muted small">One push at this hour if habits are still due</div></div>${hourSel}</div><div class="btns"><button class="btn" data-act="push-on">Enable reminders</button></div>`,
    install: `<b>Install first</b><p class="muted small" style="margin-top:4px">On iPhone, push works for Home Screen apps only: tap Share → <b>Add to Home Screen</b>, then open Willrot from there.</p>`,
    denied: `<b>Notifications blocked</b><p class="muted small" style="margin-top:4px">Allow notifications for Willrot in your device settings, then come back.</p>`,
    unsupported: `<b>Not supported here</b><p class="muted small" style="margin-top:4px">This browser doesn’t support web push.</p>`,
  }[st];
}
async function fillTodayBanner() {
  const el = $('#today-banner'); if (!el || !S.habits.length) return;
  if (lsGet('willrot_banner_dismissed', false)) return;
  const st = await pushState(); if (!$('#today-banner')) return;
  if (st === 'off' && (isStandalone() || !isIOS)) el.innerHTML = `<div class="banner"><p><b>Get a nudge when habits are due</b>One reminder a day, only if something's left.</p><button class="btn sm" data-act="push-on">Enable</button><button class="x" data-act="dismiss-banner" aria-label="Dismiss">×</button></div>`;
  else if (st === 'install') el.innerHTML = `<div class="banner"><p><b>Install Willrot</b>Share → Add to Home Screen for offline use and reminders.</p><button class="x" data-act="dismiss-banner" aria-label="Dismiss">×</button></div>`;
}

/* ============================================================
   Event wiring
   ============================================================ */
const ACT = {
  toggle: el => { const h = habitById(el.dataset.id); setLog(h, +el.dataset.n, { completed: !doneOn(h, +el.dataset.n), value: null }); },
  qty: el => qtySheet(habitById(el.dataset.id), +el.dataset.n),
  day: el => dayEditSheet(habitById(el.dataset.id), +el.dataset.n),
  'new-habit': () => habitEditor(null),
  'edit-habit': el => habitEditor(habitById(el.dataset.id)),
  'new-goal': () => goalEditor(null),
  'edit-goal': el => goalEditor(goalById(el.dataset.id)),
  'new-metric': el => metricEditor(el.dataset.id, null),
  'edit-metric': el => { const m = S.metrics.find(x => x.id === el.dataset.id); metricEditor(m.goal_id, m); },
  'log-metric': el => metricLogSheet(S.metrics.find(x => x.id === el.dataset.id)),
  'del-mlog': async el => {
    if (!confirm('Delete this entry?')) return;
    await db(sb.from('goal_metric_logs').delete().eq('id', el.dataset.id));
    S.metricLogs = S.metricLogs.filter(l => l.id !== el.dataset.id); commit();
  },
  'delete-habit': async el => {
    if (!confirm('Delete this habit and all its check-ins? Archiving keeps the history instead.')) return;
    const id = el.dataset.id;
    await db(sb.from('habits').delete().eq('id', id));
    S.habits = S.habits.filter(h => h.id !== id); S.logs = S.logs.filter(l => l.habit_id !== id); S.habitGoals = S.habitGoals.filter(x => x.habit_id !== id);
    for (const k of Object.keys(OUTBOX)) if (k.startsWith(id + '|')) delete OUTBOX[k];
    saveOutbox(); closeSheet(); commit(); if (route().name === 'habit') location.hash = '#/today';
  },
  'delete-goal': async el => {
    if (!confirm('Delete this goal and its metrics? Linked habits are kept.')) return;
    const id = el.dataset.id;
    await db(sb.from('goals').delete().eq('id', id));
    const mids = S.metrics.filter(m => m.goal_id === id).map(m => m.id);
    S.goals = S.goals.filter(g => g.id !== id); S.metrics = S.metrics.filter(m => m.goal_id !== id);
    S.metricLogs = S.metricLogs.filter(l => !mids.includes(l.goal_metric_id)); S.habitGoals = S.habitGoals.filter(x => x.goal_id !== id);
    closeSheet(); commit(); if (route().name === 'goal') location.hash = '#/goals';
  },
  'delete-metric': async el => {
    if (!confirm('Delete this metric and all its entries?')) return;
    const id = el.dataset.id;
    await db(sb.from('goal_metrics').delete().eq('id', id));
    S.metrics = S.metrics.filter(m => m.id !== id); S.metricLogs = S.metricLogs.filter(l => l.goal_metric_id !== id);
    closeSheet(); commit();
  },
  'goal-filter': el => { UI.goalFilter = el.dataset.v; render(); },
  fit: el => { lsSet('willrot_fit', el.dataset.v); applyFit(); setTimeout(render, 50); },
  'goal-outcome': async el => {
    const saved = await db(sb.from('goals').update({ status: el.dataset.v }).eq('id', el.dataset.id).select().single());
    S.goals = S.goals.map(x => x.id === saved.id ? saved : x); commit();
    toast(el.dataset.v === 'completed' ? 'Nice — marked completed' : 'Marked as missed');
  },
  'ins-win': el => { UI.insWin = +el.dataset.v; render(); },
  'toggle-archived': () => { UI.showArchived = !UI.showArchived; render(); },
  'push-on': () => enablePush(),
  'push-off': () => disablePush(),
  'push-test': () => testPush(),
  'dismiss-banner': () => { lsSet('willrot_banner_dismissed', true); $('#today-banner').innerHTML = ''; },
  refresh: () => refresh(),
  'hard-reload': async () => {
    toast('Updating…');
    try { const reg = await navigator.serviceWorker?.getRegistration(); await reg?.update(); const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); } catch {}
    location.reload();
  },
  'sign-out': async () => {
    if (Object.keys(OUTBOX).length && !confirm('Some check-ins haven’t synced yet and will be lost. Sign out anyway?')) return;
    try { const reg = await navigator.serviceWorker?.getRegistration(); const sub = await reg?.pushManager?.getSubscription(); if (sub) { await sb.from('push_subscriptions').delete().eq('endpoint', sub.endpoint); await sub.unsubscribe(); } } catch {}
    localStorage.removeItem(cacheKey()); localStorage.removeItem(outboxKey()); localStorage.removeItem('willrot_last_user');
    await sb.auth.signOut();
    S.user = null; showScreen('login');
  },
};

document.addEventListener('click', e => {
  // generic sheet controls
  const segBtn = e.target.closest('.seg[data-name] button');
  if (segBtn) {
    $$('button', segBtn.parentElement).forEach(b => b.classList.toggle('on', b === segBtn));
    const form = segBtn.closest('form');
    if (segBtn.parentElement.dataset.name === 'type') $('.show-quantity', form)?.classList.toggle('hidden', segBtn.dataset.v !== 'quantity');
    if (segBtn.parentElement.dataset.name === 'timeframe') syncGoalEnd(form);
    return;
  }
  const chip = e.target.closest('.chips[data-multi] .chip');
  if (chip) { chip.classList.toggle('on'); return; }
  const step = e.target.closest('[data-step]');
  if (step) { const i = step.parentElement.querySelector('input'); i.value = Math.max(0, (+i.value || 0) + +step.dataset.step); return; }
  const fill = e.target.closest('[data-fill]');
  if (fill) { fill.closest('form').value.value = +fill.dataset.fill || ''; return; }
  const el = e.target.closest('[data-act]');
  if (el && ACT[el.dataset.act]) { e.preventDefault(); ACT[el.dataset.act](el, e); }
});
document.addEventListener('change', async e => {
  if (e.target.name === 'start_date' && e.target.form?.end_date) syncGoalEnd(e.target.form);
  if (e.target.name === 'cadence_type') {
    const f = e.target.form;
    $$('.cad', f).forEach(x => x.classList.toggle('hidden', !x.classList.contains('cad-' + e.target.value)));
  }
  if (e.target.dataset.actChange === 'remind-hour') {
    lsSet('willrot_remind_hour', +e.target.value);
    const reg = await navigator.serviceWorker?.getRegistration(); const sub = await reg?.pushManager?.getSubscription();
    if (sub) { await saveSubscription(sub).catch(() => {}); toast(`Reminder set for ${pad(+e.target.value)}:00`); }
  }
});
window.addEventListener('hashchange', () => { render(); $('#scroller').scrollTop = 0; });

/* iOS Home Screen apps: after the keyboard closes the viewport can stay shrunk until a force-quit,
   leaving a dead band at the bottom. Toggling display on the full-height screen makes WebKit re-measure. */
let fullH = innerHeight;
addEventListener('resize', () => { fullH = Math.max(fullH, innerHeight); });
addEventListener('orientationchange', () => setTimeout(() => { fullH = innerHeight; }, 400));
function healViewport() {
  if (innerHeight >= fullH - 4 || document.activeElement?.matches?.('input,textarea,select')) return;
  const scr = $('.screen.active'), sc = $('#scroller'), top = sc ? sc.scrollTop : 0;
  if (!scr) return;
  scr.style.display = 'none'; void scr.offsetHeight; scr.style.display = '';
  if (sc) sc.scrollTop = top;
}
document.addEventListener('focusout', e => { if (e.target.matches?.('input,textarea,select')) setTimeout(healViewport, 150); });
window.addEventListener('online', () => { flush(); refresh(); });
window.addEventListener('offline', () => setSync('offline'));
let lastDay = todayN();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  setTimeout(healViewport, 100);
  if (!S.user) return;
  if (todayN() !== lastDay) { lastDay = todayN(); render(); }
  if (Date.now() - lastRefresh > 60000) refresh();
});

/* ============================================================
   Auth + boot
   ============================================================ */
function showScreen(name) {
  $$('.screen').forEach(s => s.classList.toggle('active', s.id === 'screen-' + name));
  if (name !== 'app') closeSheet();
}
function enterApp(user) {
  if (S.user?.id === user.id) return;
  S.user = { id: user.id, email: user.email };
  lsSet('willrot_last_user', S.user);
  loadCache();
  showScreen('app');
  if (!location.hash) history.replaceState(null, '', '#/today');
  render();
  refresh();
  syncPushSubscription();
}

let signUpMode = false;
$('#login-mode').addEventListener('click', () => {
  signUpMode = !signUpMode;
  $('#login-title').textContent = signUpMode ? 'Create your account' : 'Welcome back';
  $('#login-submit').textContent = signUpMode ? 'Create account' : 'Sign in';
  $('#login-mode').textContent = signUpMode ? 'I already have an account' : 'Create an account';
  $('#login-form').password.autocomplete = signUpMode ? 'new-password' : 'current-password';
  setLoginMsg('');
});
$('#login-forgot').addEventListener('click', async () => {
  const email = $('#login-form').email.value.trim();
  if (!email) return setLoginMsg('Enter your email first.', true);
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  setLoginMsg(error ? error.message : 'If that account exists, a reset link is on its way.', !!error);
});
function setLoginMsg(t, err) { const m = $('#login-msg'); m.textContent = t; m.className = 'msg ' + (err ? 'err' : 'ok'); }
$('#login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, email = f.email.value.trim(), password = f.password.value;
  if (!email || password.length < 6) return setLoginMsg('Enter your email and a password of at least 6 characters.', true);
  const btn = $('#login-submit'); btn.disabled = true; setLoginMsg('');
  try {
    if (signUpMode) {
      const { data, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.origin + location.pathname } });
      if (error) return setLoginMsg(error.message, true);
      if (data.session) enterApp(data.user);
      else setLoginMsg('Check your inbox to confirm your email, then sign in.');
    } else {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) return setLoginMsg(error.message === 'Invalid login credentials' ? 'Wrong email or password.' : error.message, true);
      enterApp(data.user);
    }
  } catch (err) { setLoginMsg(isNetErr(err) ? 'You’re offline.' : String(err.message || err), true); }
  finally { btn.disabled = false; }
});

async function boot() {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW', e));
  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY') { if (session?.user) enterApp(session.user); setTimeout(passwordSheet, 300); }
    else if (event === 'SIGNED_IN' && session?.user) enterApp(session.user);
    else if (event === 'SIGNED_OUT') { S.user = null; showScreen('login'); }
  });
  let session = null;
  try {
    const res = await Promise.race([sb.auth.getSession(), new Promise(r => setTimeout(() => r({ timeout: true }), 6000))]);
    session = res?.data?.session || null;
  } catch (e) { console.warn(e); }
  if (session?.user) return enterApp(session.user);
  // Offline with a previously signed-in user: open from cache rather than locking them out.
  const last = lsGet('willrot_last_user', null);
  if (last && !navigator.onLine) return enterApp(last);
  showScreen('login');
}
if (!window.__reloading) boot();
</script>
